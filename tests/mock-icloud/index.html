<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iCloud Test Harness</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; color: #1d1d1f; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: #fff; border-bottom: 1px solid #d2d2d7; }
  .logo { font-size: 20px; font-weight: 600; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 12px; background: #e8e8ed; color: #6e6e73; }
  nav { display: flex; gap: 18px; padding: 10px 24px; background: #fbfbfd; border-bottom: 1px solid #e8e8ed; font-size: 14px; color: #6e6e73; }
  main { padding: 16px 24px; }
  iframe { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); display: block; }
</style>
</head>
<body>
<header>
  <span class="logo">iCloud</span>
  <span class="badge">Test Harness</span>
</header>
<nav><span>Photos</span><span>Files</span><span>Notes</span><span>Calendar</span></nav>
<main>
  <iframe id="app-frame" src="app.html" style="width:100%;height:820px;border:0"></iframe>
</main>
</body>
</html>
